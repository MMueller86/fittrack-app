name: CI

# Two-tier test strategy:
#   Tier 1 (unit-tests)     — fast, offline, no Docker, no Azure.
#   Tier 2 (contract-tests) — runs CosmosWeightsRepository against the
#                             Azure Cosmos DB Linux Emulator (vNext preview)
#                             provided as a service container. Never against
#                             real Azure Cosmos DB.
#
# Contract tests depend on unit tests passing first to fail fast on cheap
# checks before spinning up the emulator.
#
# This workflow is CI only — no deploy steps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch / PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  encoding-check:
    name: Encoding check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-encoding.mjs

  unit-tests:
    name: Tier 1 — Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # `cache: npm` reads the root `package-lock.json` (npm workspaces)
          # and restores `~/.npm` keyed on its hash.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared
        run: npm run typecheck --workspace=shared

      - name: Typecheck backend
        run: npm run typecheck --workspace=backend

      - name: Typecheck mobile
        # Explicit mobile typecheck so a TS error in mobile fails the PR
        # instead of being caught only at `expo build` time.
        run: npm run typecheck --workspace=mobile

      - name: Run backend unit tests
        run: npm test --workspace=backend

  contract-tests:
    name: Tier 2 — Cosmos contract tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # GitHub Actions service container.
    # `vnext-preview` is the Linux variant — boots in <30 s and works on
    # Linux runners. The legacy Windows emulator is NOT compatible with
    # `runs-on: ubuntu-latest`.
    services:
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        ports:
          - 8081:8081

    env:
      # Pin the contract tests at the local emulator. These vars are only
      # used by `backend/src/test-utils/cosmosEmulator.ts`, which also
      # hard-codes the well-known emulator key as a defence-in-depth
      # against accidental real-Azure runs.
      #
      # The vnext-preview Linux emulator listens on PLAIN HTTP (not HTTPS).
      # See its boot log: `server up with protocol http on 0.0.0.0:8081`.
      # 127.0.0.1 (not `localhost`) avoids Node/undici resolving to ::1.
      COSMOS_ENDPOINT: http://127.0.0.1:8081

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Cosmos Emulator to become ready
        # Probes the emulator with the SAME network stack the tests use
        # (Node + undici fetch). A curl-based probe gave us false positives
        # because curl's TLS layer differs from Node's. If this script
        # exits 0, the Cosmos SDK will also be able to connect.
        run: node backend/scripts/wait-for-cosmos.mjs

      - name: Dump emulator logs on failure
        if: failure()
        run: |
          echo "----- docker ps -a -----"
          docker ps -a
          container_id=$(docker ps -a --filter "ancestor=mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview" --format '{{.ID}}' | head -n1)
          if [ -n "$container_id" ]; then
            echo "----- docker logs (last 300 lines) -----"
            docker logs --tail 300 "$container_id" || true
            echo "----- docker inspect (network) -----"
            docker inspect "$container_id" --format '{{json .NetworkSettings}}' || true
          fi

      - name: Run backend contract tests
        run: npm run test:contract --workspace=backend
