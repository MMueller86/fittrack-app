schemaVersion: '1.1'
modelRef: cycling-met-estimator@1.1.0
constants:
  activityFloorMet: 2.3
  gravityScaleMetersPerHour: 350.0
  downhillMotorReductionCoefficient: 0.75
interpolation:
  algorithm: LINEAR
  formula: y1 + ((x - x1) / (x2 - x1)) * (y2 - y1)
  belowMinimum: RETURN_FIRST_VALUE
  aboveMaximum: RETURN_LAST_VALUE
lookupTables:
  speedMet:
    input: averageSpeedKmh
    points:
    - - 0.0
      - 2.3
    - - 4.0
      - 2.5
    - - 8.0
      - 3.0
    - - 12.0
      - 3.5
    - - 16.0
      - 4.0
    - - 19.2
      - 6.8
    - - 20.0
      - 8.0
    - - 22.4
      - 8.0
    - - 25.6
      - 10.0
    - - 32.2
      - 12.0
    - - 35.0
      - 16.8
    note: Die Punkte 0-16 km/h ersetzen den früheren Clamp auf 4.0 MET.
  uphillBonusMet:
    input: uphillMetersPerHour
    points:
    - - 0.0
      - 0.0
    - - 50.0
      - 0.3
    - - 100.0
      - 0.7
    - - 200.0
      - 1.5
    - - 300.0
      - 2.3
    - - 400.0
      - 3.2
    - - 500.0
      - 4.1
    - - 600.0
      - 5.0
    - - 700.0
      - 6.0
  speedMotorFactor:
    input: averageSpeedKmh
    points:
    - - 20.0
      - 1.0
    - - 22.0
      - 0.9
    - - 24.0
      - 0.75
    - - 25.0
      - 0.6
    - - 26.0
      - 0.45
    - - 28.0
      - 0.2
    - - 30.0
      - 0.1
  supportReduction:
    NONE: 0.0
    LIGHT: 0.35
    HIGH: 0.75
  uphillReduction:
    NONE: 0.0
    LIGHT: 0.4
    HIGH: 0.75
  terrainBonusMet:
    ASPHALT: 0.0
    GRAVEL: 0.5
    TRAIL: 1.5
