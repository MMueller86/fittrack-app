<?xml version="1.0" encoding="UTF-8"?>
<!--
  FitTrack / Gesundheits App brand logo — vector recreation v2.
  1024 x 1024 square. Tuned to match docs/app_logo.png 1:1.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Apple outline gradient: lighter on the left, darker on the right -->
    <linearGradient id="appleStroke" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0"    stop-color="#A8E26B"/>
      <stop offset="0.45" stop-color="#7AC444"/>
      <stop offset="1"    stop-color="#3F7A2E"/>
    </linearGradient>

    <!-- Soft inner glow inside the apple (very faint) -->
    <radialGradient id="appleFill" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0"   stop-color="#67B23E" stop-opacity="0.10"/>
      <stop offset="0.7" stop-color="#67B23E" stop-opacity="0.03"/>
      <stop offset="1"   stop-color="#67B23E" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaf gradient (top brighter, bottom darker) -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B6E97A"/>
      <stop offset="1" stop-color="#4F9A2C"/>
    </linearGradient>

    <!-- Dumbbell metallic gradients -->
    <linearGradient id="metalPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#F8F9FA"/>
      <stop offset="0.40" stop-color="#D4D8DB"/>
      <stop offset="0.55" stop-color="#9BA1A6"/>
      <stop offset="1"    stop-color="#5A5F64"/>
    </linearGradient>
    <linearGradient id="metalBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#EEF1F3"/>
      <stop offset="0.5"  stop-color="#B5BABE"/>
      <stop offset="1"    stop-color="#74797E"/>
    </linearGradient>

    <!-- ECG bright neon green gradient -->
    <linearGradient id="ecgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#5BAA34"/>
      <stop offset="0.4" stop-color="#8FD157"/>
      <stop offset="1"   stop-color="#A8E26B"/>
    </linearGradient>

    <!-- Subtitle underline -->
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#67B23E" stop-opacity="0"/>
      <stop offset="0.2"  stop-color="#67B23E" stop-opacity="1"/>
      <stop offset="0.8"  stop-color="#67B23E" stop-opacity="1"/>
      <stop offset="1"    stop-color="#67B23E" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle wordmark gradient (white left → slightly darker right) -->
    <linearGradient id="wordWhite" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="1"   stop-color="#C4C8C7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#000000"/>

  <!-- ============ MARK ============ -->

  <!-- Stem + leaves (placed first so the apple covers their bases) -->
  <g transform="translate(512,228)">
    <!-- short stem hidden where leaves meet -->
    <path d="M 0 4 C -2 -8 -2 -18 0 -28"
          stroke="#3F7A2E" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- Left leaf — almond/teardrop, tip pointing up-left -->
    <path d="M 0 -4
             C -10 -28 -50 -70 -118 -78
             C -110 -38 -64 -10 -6 0 Z"
          fill="url(#leafGrad)" stroke="#3F7A2E" stroke-width="5"/>
    <!-- Left leaf vein -->
    <path d="M -8 -8 C -50 -28 -90 -52 -114 -74"
          stroke="#3F7A2E" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Right leaf — mirror -->
    <path d="M 0 -4
             C 10 -28 50 -70 118 -78
             C 110 -38 64 -10 6 0 Z"
          fill="url(#leafGrad)" stroke="#3F7A2E" stroke-width="5"/>
    <!-- Right leaf vein -->
    <path d="M 8 -8 C 50 -28 90 -52 114 -74"
          stroke="#3F7A2E" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Apple body — heart-shaped silhouette, outline only with subtle inner glow -->
  <!--
    Shape:
      - Top: two lobes meeting in the centre at y=240 (small notch)
      - Sides: bulge out to ~x=300 and x=724 around y=470
      - Bottom: small "M" dimple at the centre (~y=720)
  -->
  <path d="M 512 248
           C 502 232 482 226 460 234
           C 360 246 280 320 272 430
           C 264 540 320 660 410 712
           C 446 732 484 720 502 706
           C 510 700 514 700 522 706
           C 540 720 578 732 614 712
           C 704 660 760 540 752 430
           C 744 320 664 246 564 234
           C 542 226 522 232 512 248 Z"
        fill="url(#appleFill)"
        stroke="url(#appleStroke)"
        stroke-width="24"
        stroke-linejoin="round"/>

  <!-- Bottom apple dimple (small inward "M" bump) -->
  <path d="M 470 712
           C 488 702 500 700 512 712
           C 524 700 536 702 554 712"
        fill="none"
        stroke="url(#appleStroke)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- ============ DUMBBELL (drawn over apple) ============ -->
  <g>
    <!-- Bar (horizontal centre) -->
    <rect x="290" y="500" width="444" height="24" rx="5" fill="url(#metalBar)"/>
    <!-- Bar inner highlight -->
    <rect x="294" y="503" width="436" height="3" fill="#FFFFFF" fill-opacity="0.6"/>
    <!-- Inner collars -->
    <rect x="298" y="492" width="14" height="40" rx="3" fill="url(#metalBar)"/>
    <rect x="712" y="492" width="14" height="40" rx="3" fill="url(#metalBar)"/>

    <!-- LEFT plates: small (innermost) → medium → large (outermost) -->
    <rect x="278" y="476" width="24" height="72"  rx="5"  fill="url(#metalPlate)"/>
    <rect x="244" y="458" width="34" height="108" rx="7"  fill="url(#metalPlate)"/>
    <rect x="200" y="438" width="44" height="148" rx="9"  fill="url(#metalPlate)"/>

    <!-- RIGHT plates (mirror) -->
    <rect x="722" y="476" width="24" height="72"  rx="5"  fill="url(#metalPlate)"/>
    <rect x="746" y="458" width="34" height="108" rx="7"  fill="url(#metalPlate)"/>
    <rect x="780" y="438" width="44" height="148" rx="9"  fill="url(#metalPlate)"/>

    <!-- Vertical highlights for 3D feel -->
    <rect x="208" y="446" width="6"  height="132" rx="2" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="252" y="464" width="5"  height="96"  rx="2" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="284" y="482" width="4"  height="60"  rx="2" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="788" y="446" width="6"  height="132" rx="2" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="754" y="464" width="5"  height="96"  rx="2" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="732" y="482" width="4"  height="60"  rx="2" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>

  <!-- ============ ECG / heartbeat line ============ -->
  <!--
    Centred on the dumbbell bar (y=512). Sequence:
      flat → small dip → big peak up → deeper trough → peak up → flat
  -->
  <path d="M 312 512
           L 440 512
           L 470 512
           L 500 444
           L 540 612
           L 580 348
           L 618 612
           L 650 512
           L 712 512"
        fill="none"
        stroke="url(#ecgGrad)"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- ============ WORDMARK "GESUNDHEITS APP" ============ -->
  <!-- Wider letter spacing for readability, matching the original.
       Font size and spacing tuned so the full wordmark fits inside
       the 1024px width with comfortable margins. -->
  <g transform="translate(512,840)" text-anchor="middle">
    <text y="0"
          font-family="'Helvetica Neue', 'Arial Black', Impact, Arial, sans-serif"
          font-weight="900"
          font-size="92"
          letter-spacing="8">
      <tspan fill="url(#wordWhite)">GESUNDHEITS </tspan><tspan fill="#67B23E">APP</tspan>
    </text>
  </g>

  <!-- ============ SUBTITLE with bracket dashes ============ -->
  <!--
    The original uses literal em-dash characters as brackets on each side
    of the subtitle, not gradient underlines.
  -->
  <g transform="translate(512,915)" text-anchor="middle">
    <text y="0"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-weight="700"
          font-size="30"
          letter-spacing="4"
          fill="#F2F4F1">
      <tspan fill="#67B23E">— </tspan>
      <tspan>ERNÄHRUNG</tspan><tspan fill="#67B23E">.</tspan>
      <tspan> TRAINING</tspan><tspan fill="#67B23E">.</tspan>
      <tspan> FORTSCHRITT</tspan><tspan fill="#67B23E">.</tspan>
      <tspan fill="#67B23E"> —</tspan>
    </text>
  </g>
</svg>
